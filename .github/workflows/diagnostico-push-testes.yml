name: Acionar diagnóstico Push — TESTES

on:
  schedule:
    - cron: "0 12,17,22 * * 1"
    - cron: "0 13,18,23 * * 2"
    - cron: "0 11,16,21 * * 3"
    - cron: "0 12,17,22 * * 4"
    - cron: "30 12,17,22 * * 5"
    - cron: "0 13,18,23 * * 6"
    - cron: "30 11,16,21 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnostico-push-testes
  cancel-in-progress: false

jobs:
  acionar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validar configuração pública de OIDC
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_DIAGNOSTICO_SERVICE_ACCOUNT }}
          SERVICE_URL: ${{ vars.CLOUD_RUN_DIAGNOSTICO_URL }}
        run: |
          test -n "$WIF_PROVIDER" || (echo "Falta a variável GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1)
          test -n "$GCP_SERVICE_ACCOUNT" || (echo "Falta a variável GCP_DIAGNOSTICO_SERVICE_ACCOUNT"; exit 1)
          test -n "$SERVICE_URL" || (echo "Falta a variável CLOUD_RUN_DIAGNOSTICO_URL"; exit 1)
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DIAGNOSTICO_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Acionar serviço autenticado no Google Cloud Run
        env:
          SERVICE_URL: ${{ vars.CLOUD_RUN_DIAGNOSTICO_URL }}
        run: |
          TOKEN="$(gcloud auth print-identity-token --audiences="$SERVICE_URL")"
          curl --fail-with-body --silent --show-error --max-time 1200 \
            -X POST "$SERVICE_URL/diagnostico" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"ambiente":"testes"}'
