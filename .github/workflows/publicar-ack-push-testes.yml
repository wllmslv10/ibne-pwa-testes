name: Publicar confirmação Push — TESTES

on:
  workflow_dispatch:
  push:
    paths:
      - 'ack-worker/**'
      - '.github/workflows/publicar-ack-push-testes.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar Worker no Cloudflare (ambiente de testes)
        working-directory: ack-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.IBNE_TEST_DATABASE_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta o segredo CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta o segredo CLOUDFLARE_ACCOUNT_ID"; exit 1)
          test -n "$DATABASE_URL" || (echo "Falta o segredo IBNE_TEST_DATABASE_URL"; exit 1)
          npm install
          npx wrangler secret put DATABASE_URL <<< "$DATABASE_URL"
          npx wrangler deploy
